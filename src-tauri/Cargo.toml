[package]
name = "session-lantern"
version = "0.2.1"
edition = "2021"
description = "Local session export companion"
license = "GPL-3.0-only"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "~2.12.4", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "~2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
zeroize = "1"
semver = "1"
tauri-plugin-opener = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
native-smoke = []
